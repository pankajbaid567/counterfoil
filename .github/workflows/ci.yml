name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      COUNTERFOIL_TEST_DB_URL: jdbc:postgresql://localhost:5432/postgres
      COUNTERFOIL_TEST_DB_USER: postgres
      COUNTERFOIL_TEST_DB_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: unit, property, concurrency and API tests
        run: ./mvnw -B -q test
      - name: package
        run: ./mvnw -B -q package -DskipTests
      - name: crash test (smoke)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 postgresql-client-16 > /tmp/apt.log 2>&1 || { tail -5 /tmp/apt.log | sed 's/^/::error::apt: /'; exit 1; }
          set +e
          java tools/crashtest/CrashTest.java --pg-bin /usr/lib/postgresql/16/bin --workers 2 --cycles 10 --out /tmp/crash > /tmp/crash.out 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            # surface the reason as public annotations (job logs need a login to read)
            tail -15 /tmp/crash.out | sed 's/^/::error::crash: /'
            for f in /tmp/crash/app-w*.log; do tail -6 "$f" | sed 's/^/::error::app: /'; done
          fi
          exit $rc
      - name: injected bugs must be caught (unit-test mutants)
        run: python3 scripts/mutation_check.py --skip-crash
